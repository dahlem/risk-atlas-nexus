documents:
- id: arxiv.org/abs/2407.17436
  name: 'AIR-Bench: A Regulation-Aligned Safety Benchmark for Responsible AI Development'
  description: AIR-Bench is the first AI safety benchmark aligned with emerging government
    regulations and company policies. It features a four-tiered safety taxonomy with
    314 granular risk categories derived from analyzing 8 government regulations and
    16 company policies.
  url: https://arxiv.org/abs/2407.17436
  dateCreated: '2024-07-29'
  dateModified: '2024-07-29'
taxonomies:
- id: airbench-hf
  name: AIR-Bench Taxonomy (HuggingFace)
  description: A four-tiered safety taxonomy with 314 granular risk categories derived
    from analyzing 8 government regulations and 16 company policies.
  url: https://arxiv.org/abs/2407.17436
  dateCreated: '2024-07-29'
  version: '1.0'
  hasDocumentation:
  - arxiv.org/abs/2407.17436
